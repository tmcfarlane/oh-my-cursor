<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Nested hexagons — "wisdom / structure / crystalline order" -->
  <!-- Flat-top hexagons centered at (32,32) -->
  <!-- Outer hex R=21 (vertex at right): -->
  <!--   (53,32) (42.5,13.82) (21.5,13.82) (11,32) (21.5,50.18) (42.5,50.18) -->
  <!-- R=21: R*√3/2 = 18.19; R/2 = 10.5 -->
  <polygon
    points="53,32 42.5,13.82 21.5,13.82 11,32 21.5,50.18 42.5,50.18"
    stroke="#9ba1a9" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Inner hex R=12: -->
  <!--   (44,32) (38,21.61) (26,21.61) (20,32) (26,42.39) (38,42.39) -->
  <!-- R=12: R*√3/2=10.39; R/2=6 -->
  <polygon
    points="44,32 38,21.61 26,21.61 20,32 26,42.39 38,42.39"
    stroke="#e9ebee" stroke-width="2" stroke-linejoin="round"/>
  <!-- Blue accent: center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#4c8dff"/>
</svg>
