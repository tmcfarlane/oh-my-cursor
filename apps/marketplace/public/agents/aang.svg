<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Three concentric open arcs — "breath / air / orchestration" -->
  <!-- Arcs open at bottom, sweep through the top, centered on (32,32) -->
  <!-- Outer arc r=22: endpoints at 120° and 60° on circle centered (32,32) -->
  <path d="M 21,51.05 A 22,22 0 1 1 43,51.05" stroke="#9ba1a9" stroke-width="2" stroke-linecap="round"/>
  <!-- Mid arc r=14 -->
  <path d="M 25,44.12 A 14,14 0 1 1 39,44.12" stroke="#9ba1a9" stroke-width="2" stroke-linecap="round"/>
  <!-- Inner arc r=7 -->
  <path d="M 28.5,38.06 A 7,7 0 1 1 35.5,38.06" stroke="#e9ebee" stroke-width="2" stroke-linecap="round"/>
  <!-- Blue accent: center anchor dot -->
  <circle cx="32" cy="32" r="2.5" fill="#4c8dff"/>
</svg>
