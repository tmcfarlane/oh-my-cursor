<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Three ascending chevrons — "intensity / fire / upward drive" -->
  <!-- Chevrons nest inside each other, peaks rise toward top -->
  <!-- Outer / lowest chevron, muted -->
  <path d="M 13,50 L 32,31 L 51,50" stroke="#9ba1a9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle chevron, bright -->
  <path d="M 18,42 L 32,23 L 46,42" stroke="#e9ebee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Inner / highest chevron — blue accent, the leading edge -->
  <path d="M 23,34 L 32,16 L 41,34" stroke="#4c8dff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
